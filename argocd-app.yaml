apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: django-k8s-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Eitan95/django-k8s-platform.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
